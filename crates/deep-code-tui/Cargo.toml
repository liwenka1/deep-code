[package]
name = "deep-code-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deep-code terminal UI (scaffold)"

[[bin]]
name = "deep-code"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# 0.28 on purpose, matching the crossterm inside ratatui 0.29: a direct dep
# on 0.29 shipped TWO copies of crossterm in the binary (both driving the same
# terminal) for no API gain — the surface used here is cursor/event/execute/
# terminal, identical in both. Bump together with ratatui, not independently.
crossterm = { version = "0.28", features = ["event-stream"] }
deep-code-agent = { path = "../deep-code-agent" }
deep-code-eval = { path = "../deep-code-eval" }
deep-code-runtime = { path = "../deep-code-runtime" }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
# Pure-Rust highlighting (fancy-regex, no C toolchain). Bundled grammars +
# themes cost ~0.55 MB of release binary (3.80 → 4.37 MB, darwin-arm64) —
# LTO prunes the unused syntect paths a standalone probe cannot.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

# Redirect stderr to the log file on Windows (SetStdHandle), mirroring the
# unix `dup2` path so stray writes can't paint over the alternate-screen TUI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
tempfile = "3"
