[package]
name = "deep-code-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deep-code terminal UI (scaffold)"

[[bin]]
name = "deep-code"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
deep-code-agent = { path = "../deep-code-agent" }
deep-code-runtime = { path = "../deep-code-runtime" }
futures-util = "0.3"
ratatui = "0.29"
serde_json = "1.0.149"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
