[package]
name = "deep-code-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deep-code agent core library (scaffold)"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
toml_edit = "0.20"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# Linux sandbox backend (Landlock filesystem confinement + seccomp syscall
# filtering). Linux-only so macOS/Windows builds never pull these.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

# Windows sandbox backend (Job Object: process-tree kill + resource limits).
# Job Object APIs span several windows-sys features: CreateJobObjectW needs
# Win32_Security (SECURITY_ATTRIBUTES); the EXTENDED_LIMIT struct needs
# Win32_System_Threading (+ Win32_System_IO for its IO_COUNTERS field).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
