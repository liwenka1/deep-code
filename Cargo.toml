[workspace]
resolver = "2"
members = [
    "crates/deep-code-agent",
    "crates/deep-code-runtime",
    "crates/deep-code-tui",
    "crates/deep-code-eval",
]

[workspace.package]
version = "0.4.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/liwenka1/deep-code"

# 最小体积 release profile —— 用于 npm 分发
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
