# deep-code 配置文件示例
#
# 加载顺序（后者覆盖前者）：
#   内置默认 -> 全局 ~/.deep-code/config.toml -> 项目 .deep-code/config.toml -> 环境变量 -> CLI 参数
#
# 项目层只允许调优字段：provider.model / provider.reasoning_effort /
# cost.currency / ui.language。
# 其余行为旋钮（provider.timeout_secs、stream.*、checkpoints.*、context.*、
# cost.auto_cost_saving、approval.auto_allow）在项目层一律忽略并告警——防止恶意
# 仓库饿死流、撑爆快照保留或静默解除审批门；请在全局配置或环境变量中设置。
#
# 只许收紧（tighten-only）三项：项目层可以更严、不能更松，越界即忽略并告警。
#   - approval.default_mode：只能降档（例如 auto -> default），不能升档。
#     注意：升档一档也不行——accept_edits 就已经自动放行全部工作区写入。
#   - sandbox.network：只能设 prompt/never，设 always 会被忽略。
#   - lsp.enabled：只能设 false（关掉 language server），不能替你打开。
#
# 项目层的 provider.api_key 一律忽略（防止随仓库泄露或被恶意仓库注入）；
# 项目层覆盖 provider.base_url 会被硬拒。

[provider]
# DeepSeek API Key。建议只放在环境变量 DEEPSEEK_API_KEY 或本全局文件中；
# 写入本文件后请执行 chmod 600 限制权限。
# api_key = "sk-..."

# API 端点。默认 https://api.deepseek.com/beta（beta 支持 reasoning 流）。
# base_url = "https://api.deepseek.com/beta"

# 模型：deepseek-v4-pro / deepseek-v4-flash / auto（按任务自动路由）。
# model = "auto"

# 推理力度：off / low / medium / high / max。
# reasoning_effort = "high"

# 打开请求超时（秒）：连接 + 等待响应头；不限制流式响应本身（流的存活由 [stream] 超时管理）。
# timeout_secs = 60

[checkpoints]
# 检查点保留上限：每轮开始前存一份工作区快照，超出上限按最旧删除（0 = 不清理）。
# max_snapshots = 20

[sandbox]
# shell/job 命令的联网授权。命令一律在 OS 沙箱内运行,默认不带网络(含端口监听);
# 模型认为命令需要联网时会在参数里声明 network=true,该声明强制转人工审批
# (审批面板显示"申请联网"),"本会话记住"按命令 identity 生效(批过 git push
# 后同形态不再问)。信任与联网是两个独立授权:沙箱内读取宽泛,若放行即联网,
# 任何被自动放行的命令都可能把读到的内容外送——这就是默认 prompt 的原因。
# 子代理派遣(agent 工具)声明 network=true 时同受本设置约束:never 直接拒,
# always 免网络审批;获授子代理的白名单命令 egress 常开(其审批无人在环,
# 逐条声明保护不了任何东西)。
#   prompt  声明 → 审批(默认)
#   always  所有沙箱命令直接带网(回到旧行为,零打扰;只在全局层生效)
#   never   声明联网的命令直接拒绝
# network = "prompt"

[cost]
# 成本展示货币：cny / usd。
# currency = "cny"

# auto 模式下成本优先（倾向 Flash）。
# auto_cost_saving = false

[lsp]
# 编辑后 LSP 诊断总开关。开启时,写文件/改补丁后会拉起对应语言服务器取一次
# 诊断并把错误随工具结果回给模型;关掉则完全不启动语言服务器(需要的语言
# 服务器没装、或不想让它跑时用)。轮询间隔与条数上限是常量,不可配。
# enabled = true

[context]
# 触发压缩的 token 阈值（默认按模型上下文窗口计算，一般无需设置）。
# compaction_threshold = 800000

[approval]
# 预先放行的工具全名（精确匹配，不是前缀）：命中的受审批工具直接执行
# （事件流中仍留 approval_resolved 审计记录）。策略硬拒绝不受影响。
# 之所以不做前缀匹配：常备同意不该被拉伸——"s" 会同时盖住 shell 与 skill，
# 未来新增的同前缀工具也会未经任何人决定就带着放行上线。
# 安全说明：本节只在环境变量(DEEP_CODE_APPROVAL_AUTO_ALLOW，逗号分隔)
# 或全局配置中生效；项目 .deep-code/config.toml 中的本节会被忽略并警告，
# 防止恶意仓库静默解除审批门。
# 注意：放行是整个工具的常备同意，连带跳过 [sandbox] network 的逐条联网
# 审批——配了 "shell" 后，声明 network=true 的命令会直接带网执行不再询问。
# 想要零打扰联网请用 [sandbox] network = "always"，而不是放行整个 shell。
# 唯一的例外：request_write_root（模型申请可写根）不受本节影响，命中全名
# 也照样弹审批——扩大写边界是一次只能由人做的决定，不存在常备同意。
# 只对"本来就要审批"的工具有意义：read_file / list_dir / grep_files 归类为
# 只读与检索，本就不过审批门，写进来是个 no-op（也不会有警告，因为它们确实
# 挂载了）。下面的示例用真正受审批的工具。
# auto_allow = ["write_file", "apply_patch"]

# 权限模式:启动时的审批档位。
# default(每次询问)| accept_edits(自动放行工作区内编辑)| auto(AI 判断)| yolo(除写根申请外全放开)。
# 项目配置只能设 default/accept_edits;auto/yolo 只能来自全局配置(防止恶意仓库静默解除审批门)。
# 注意 yolo 不是字面意义的"全放开":request_write_root 在任何档位都要弹审批。
# yolo 下沙箱命令 egress 常开(声明制在无人在环时拦不住恶意、只坑忘声明的);
# [sandbox] network = "never" 在 yolo 下依然绝对。
# 运行时按 Shift+Tab 循环切换。
# auto 档的边界(有意取舍):AI 判官只读取命令与参数文本,不读取待写入的
# 文件内容——write_file/apply_patch 的实质内容不经判官审阅(高风险档、联网
# 声明与离线后端仍然硬性转人工)。在意这条边界就用 default/accept_edits。
#
# 另一条硬规则(不可配):命令文本里出现 > < ` $ 任一字符(重定向、命令替换、
# 变量展开)就一律转人工审批,不进任何自动放行面。所以 `echo $HOME`、
# `mkdir -p src/$MOD`、`cp a "$HOME/b"` 这类即使在 accept_edits/auto 档也会
# 问一次——间接形态没法靠静态解析看清最终行为,交由人眼是有意的保守取舍。
# default_mode = "default"

[stream]
# 首内容到达前的透明重试次数。
# max_retries = 3

# 连续无数据的卡顿超时（秒）。
# chunk_timeout_secs = 300

# 单次流式响应总时长上限（秒）。
# total_timeout_secs = 900

# 累计内容体积上限（字节）。
# max_bytes = 52428800

[ui]
# 界面语言：auto（跟随系统 LANG/LC_ALL）| zh | en。
# 环境变量 DEEP_CODE_LANG 优先级最高；也可在 TUI 内用 /lang 切换并持久化。
# language = "auto"
