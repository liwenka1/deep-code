# deep-code configuration example
#
# English, like the CLI surface and the primary README. This file is what the
# unknown-key warning tells you to compare your own config against, so it is the
# one copy and it is kept in step with the schema by tests
# (`every_documented_section_reports_its_unknown_keys` and
# `the_documented_example_config_produces_no_warnings`).
#
# Load order, later layers overriding earlier ones:
#   builtin defaults -> global ~/.deep-code/config.toml
#   -> project .deep-code/config.toml -> environment -> CLI flags
#
# The project layer may only set tuning fields: provider.model,
# provider.reasoning_effort, cost.currency and ui.language.
#
# Every other behaviour knob (provider.timeout_secs, stream.*, checkpoints.*,
# context.*, approval.auto_allow) is ignored there, with
# a warning — so a hostile repository cannot starve your streams, blow up
# snapshot retention, or quietly lift the approval gate. Set those globally or
# in the environment.
#
# Five settings are tighten-only from the project layer: a repo may be
# stricter than your global config, never looser, and an attempt to loosen is
# ignored with a warning.
#   - approval.default_mode may only tighten the user's mode (yolo to default, for example).
#     Not even one step up: accept_edits already waves through every workspace
#     write.
#   - sandbox.network may only be stricter than the global value (always, then
#     prompt, then never). Widening is ignored — with a global "never", a
#     project-layer "prompt" is ignored too.
#   - sandbox.mode may only be stricter than the global value (off, then os).
#     A repository may ask for `os`; it can never turn its own confinement off.
#   - budget.turn_steps may only be LOWERED, and may not be set to 0: 0 is the
#     loosest value (no ceiling), not the smallest, so a repo reaching for it is
#     widening exactly like one reaching for a huge number.
#   - lsp.enabled may only be set false (turning the language server off). It
#     cannot turn it on for you.
#
# provider.api_key in the project layer is always ignored (so a key cannot leak
# with the repo, nor be injected by one), and a project-layer provider.base_url
# override is refused outright.
#
# Startup and `deepcode doctor` report unknown keys and unrecognized values.
# `deepcode doctor` also shows the effective sandbox network mode.

[provider]
# DeepSeek API key. Prefer the DEEPSEEK_API_KEY environment variable or this
# global file; if you do write it here, `chmod 600` the file.
# api_key = "sk-..."

# API endpoint. Defaults to https://api.deepseek.com/beta (the beta endpoint is
# the one that streams reasoning).
# base_url = "https://api.deepseek.com/beta"

# Choose pro, flash, or a model ID listed by `deepcode doctor`. The default is deepseek-flash.
# model = "deepseek-flash"

# Reasoning effort can be none, low, high, or max. Defaults to high. Choose
# none to disable thinking.
# reasoning_effort = "high"

# Request timeout in seconds: connect plus waiting for response headers. It does
# not bound the streamed response itself — the [stream] timeouts below own that.
# timeout_secs = 60

[checkpoints]
# Snapshot retention. A workspace snapshot is taken after each completed turn. Beyond
# this count the oldest are deleted. Zero keeps every snapshot.
# max_snapshots = 20

[sandbox]
# Network authorization for shell/job commands. Commands always run inside the
# OS sandbox and have no network by default (port binding included). When the
# model judges that a command needs the network it declares network=true in the
# arguments, and that declaration forces a human approval — the panel says the
# command is requesting network access, and "remember for this session" is keyed
# on the command identity, so a second `git push` of the same shape stops
# asking.
#
# Trust and egress are two separate grants. Reads inside the sandbox stay broad,
# so if auto-approval also opened the network, any auto-approved command could
# send out whatever it had read. That is why the default is to ask.
#
# Sub-agent dispatches (the agent tool) declaring network=true are bound by this
# setting too: "never" refuses them outright, "always" makes the egress prompt
# unnecessary. An authorized child gets ambient egress for its allow-listed
# commands — its own approvals have nobody in the loop, so a per-call
# declaration there would protect nothing. The network-native tools (fetch_url,
# web_search) ARE egress by definition: "never" refuses them as well, while
# "prompt" and "always" route them through the ordinary human approval.
#
#   prompt  a declaration goes to a human (the default)
#   always  every sandboxed command gets the network, no prompt (the old
#           coupled behaviour; only the global layer may set it)
#   never   declaring commands, networked dispatches and the web tools are all
#           refused outright
# network = "prompt"
#
# Whether the OS sandbox runs at all.
#
#   os   the default. Everything this section describes — writes bounded to the
#        granted roots, no egress without a grant — is what you get.
#   off  every shell/job command runs bare, because the boundary is provided by
#        something larger than this process: a container, a micro-VM, a
#        disposable CI runner. Commands are not refused for lack of a backend
#        either, so this is also the answer on a host whose probe fails.
#
# Read this as "I am already inside a fence": it removes the write and network
# confinement outright, and the commands this agent runs inherit your whole user
# account. It is global-layer only (a repository may tighten to `os` but never
# loosen to `off`), `deepcode doctor` reports the value in force, and the status
# line carries a permanent `[unsandboxed]` chip while it is not `os`.
# mode = "os"
#
# Commands that are irreversible AND outward-facing — publishing a package,
# force-pushing over someone's commits, merging a PR, applying infrastructure,
# deleting a bucket — require explicit approval in every interactive mode.
# Headless runs and sub-agents deny those requests. List a command here to
# pre-authorize that class of command.
#
# Entries match the words the executor would run, IN ORDER, so a flag cannot
# hide from them: `npm publish --tag next` is matched by "npm publish", and
# `git push origin main --force` needs the force flag spelled out. An entry is
# read from the command's program word, so "git push" never matches a different
# command that merely mentions it (a PR merge whose subject says "git push").
# A dry run is never refused — `npm publish --dry-run` and `kubectl delete
# --dry-run=client` publish and delete nothing — unless the `--dry-run` could be
# the value of the option right before it (`git push -f origin main -o
# --dry-run` really pushes), which asks instead.
#
# The entry does not have to name every word, and that is the part to read twice.
# A shorter entry authorizes the wider thing on purpose: an entry for `git push`
# also authorizes a force push, and an entry for the single word `push` also
# authorizes `docker push` — the match is over words IN ORDER, not over programs.
# Write the longest run you actually mean.
#
# Global layer only, the same class as approval.auto_allow: an exemption written
# by a checked-out repository would be a repository granting itself the right to
# publish on your behalf.
# allow_irreversible = ["npm publish"]

[budget]
# Model requests allowed in one turn. A turn is one user message and everything
# the model does before it stops; every iteration is one API request whose
# context is larger than the last, and the only other exits are your cancel key,
# a stream error, an empty tool batch or an approval park — so this is the one
# backstop a runaway loop has.
#
# 0 means no ceiling at all. That is a real option, and the config says what it
# costs rather than hiding it: with nobody at the keyboard (yolo, a sub-agent, a
# headless run) nothing stops a model that keeps calling tools except the
# stream's own timeouts. Prefer a large finite number to 0.
#
# A project config may only LOWER this (it spends less of your money), and never
# raise it nor set 0 — a repository must not be able to unlock your budget.
# turn_steps = 500

[cost]
# Display currency for costs: cny or usd.
# currency = "cny"

[lsp]
# Master switch for post-edit LSP diagnostics. When on, writing a file or
# applying a patch starts the matching language server, collects one round of
# diagnostics, and returns the errors to the model alongside the tool result.
# When off, no language server is ever started — useful when the server is not
# installed, or when you would rather it did not run. The poll interval and the
# per-round cap are constants, not settings.
# TypeScript/JavaScript additionally require DEEP_CODE_TRUST_TYPESCRIPT_LSP=1
# (or true/on) in the environment BEFORE launch. These servers may execute
# repository TypeScript/plugin code with your full rights, so enable them only
# for trusted environments. Project config and permission modes cannot grant
# this trust. Rust diagnostics do not require that opt-in.
# enabled = true

[context]
# Token threshold that triggers compaction. Derived from the model's context
# window by default, so this rarely needs setting.
# compaction_threshold = 800000

[approval]
# Tool names pre-cleared from approval, matched in full (not as a prefix): a
# gated tool named here runs straight away, and the event stream still carries
# an approval_resolved record for the audit trail. Policy hard-denials are
# unaffected.
#
# Why full names rather than prefixes: standing consent must not stretch. A rule
# of "w" would cover write_file and web_search at once, and a tool added later
# whose name extends an existing entry would ship pre-approved without anyone
# deciding that.
#
# Security: this section only takes effect from the environment
# (DEEP_CODE_APPROVAL_AUTO_ALLOW, comma-separated) or the global config. In a
# project .deep-code/config.toml it is ignored with a warning, so a hostile repo
# cannot quietly lift the approval gate.
#
# sandbox.allow_irreversible is global-layer for the same reason (see [sandbox]):
# an exemption written by a checkout would be that checkout granting itself the
# right to publish on your behalf.
#
# Note that clearing a tool is standing consent to the WHOLE tool, which
# includes skipping the per-call network approval described under [sandbox]:
# clear "shell" and a command declaring network=true runs with egress, unasked.
# If what you want is undisturbed networking, set the sandbox network mode to
# "always" instead of clearing all of shell.
#
# One exception: request_write_root (the model asking for a writable root) is
# never covered here. Naming it in full still raises the prompt — widening the
# write boundary is a decision only a human makes, and there is no standing
# consent for it.
#
# Only meaningful for tools that would otherwise be gated. read_file, list_dir
# and grep_files are read-only and never reach the approval gate, so listing
# them is a no-op (and warns about nothing, because those tools do exist). The
# example below uses tools that really are gated.
# auto_allow = ["write_file", "apply_patch"]

# Permission modes at startup
#   default       prompt for gated calls without standing consent
#   accept_edits  also approve workspace edits and bounded filesystem commands
#   yolo          approve other eligible calls and give sandboxed commands
#                 network access unless the sandbox network mode is never
#
# Write-root requests and unauthorized irreversible commands require explicit
# approval in every mode. Policy denials take precedence.
# Project settings can only tighten the user's permission mode.
# Omit default_mode to inherit the lower layer. An invalid value selects
# the strictest mode, default, and generates a warning.
# Shift+Tab cycles modes. At the YOLO prompt, press F2 followed by F7 to
# confirm, or Shift+Tab again to return to default.
#
# Trusted commands, remembered command approvals, and bounded filesystem edits
# run using the parsed arguments. Commands with shell expansions, redirects,
# or operands spelled outside the working directory go through the approval
# gate. Explicit approval runs the original shell text. For calls eligible for
# automatic approval, a matching auto_allow entry or yolo can also authorize it.
# default_mode = "default"

[stream]
# Transparent retries before the first content arrives.
# max_retries = 3

# Stall timeout in seconds with no data at all.
# chunk_timeout_secs = 300

# Total wall-clock ceiling for one streamed response, in seconds.
# total_timeout_secs = 900

# Cumulative response body ceiling, in bytes.
# max_bytes = 52428800

[ui]
# Interface language: auto (follows the system LANG/LC_ALL), zh, or en.
# DEEP_CODE_LANG outranks this; /lang switches and persists it from the TUI.
# language = "auto"
# Ring the terminal (BEL + an OSC 9 desktop notification where the terminal
# supports it) when a turn or a /compact that ran for a while ends (an error
# included), or when an approval is waiting for you. Set to false for a silent
# session.
# notifications = true

[vision]
# Provider processing detail for user and tool image observations. With the
# DeepSeek provider, select Flash for image support. Unsupported images get
# explicit omission notes.
# The TUI preserves an attached-image draft when the selected model cannot see it.
#
#   low       provider uses a low-resolution representation
#   original  provider uses the original image
#   auto      let the provider decide
#
# Uploaded bytes are not resized locally. The session references immutable
# content-addressed assets; changing the source path cannot change history.
#
# Unlike the permission fields, this one has no project-layer guard: it changes
# the quality and cost of images you chose to attach, and can widen nothing.
# default: auto
# detail = "auto"
