# deep-code 配置文件示例
#
# 加载顺序（后者覆盖前者）：
#   内置默认 -> 全局 ~/.deep-code/config.toml -> 项目 .deep-code/config.toml -> 环境变量 -> CLI 参数
#
# 项目层只允许调优字段：provider.model / provider.reasoning_effort / cost.currency。
# 其余行为旋钮（provider.timeout_secs、stream.*、checkpoints.*、context.*、
# cost.auto_cost_saving、approval.*）在项目层一律忽略并告警——防止恶意仓库
# 饿死流、撑爆快照保留或静默解除审批门；请在全局配置或环境变量中设置。
# 项目层的 provider.api_key 一律忽略（防止随仓库泄露或被恶意仓库注入）；
# 项目层覆盖 provider.base_url 会在启动时给出醒目警告。

[provider]
# DeepSeek API Key。建议只放在环境变量 DEEPSEEK_API_KEY 或本全局文件中；
# 写入本文件后请执行 chmod 600 限制权限。
# api_key = "sk-..."

# API 端点。默认 https://api.deepseek.com/beta（beta 支持 reasoning 流）。
# base_url = "https://api.deepseek.com/beta"

# 模型：deepseek-v4-pro / deepseek-v4-flash / auto（按任务自动路由）。
# model = "auto"

# 推理力度：off / low / medium / high / max。
# reasoning_effort = "high"

# 打开请求超时（秒）：连接 + 等待响应头；不限制流式响应本身（流的存活由 [stream] 超时管理）。
# timeout_secs = 60

[checkpoints]
# 检查点保留上限：每轮前后各存一份工作区快照，超出上限按最旧删除（0 = 不清理）。
# max_snapshots = 20

[cost]
# 成本展示货币：cny / usd。
# currency = "cny"

# auto 模式下成本优先（倾向 Flash）。
# auto_cost_saving = false

[auto]
# auto 模式遇到“中等难度、无明确关键词”的模糊任务时，调用一次 Flash
# (thinking-off) 分类器结合最近上下文判定模型与思考力度。关掉则退回纯启发式
# （不产生额外模型调用）。对应环境变量 DEEP_CODE_AUTO_ROUTER_ENABLED。
# router_enabled = true

# Flash 路由的硬超时（毫秒）；超时静默回退启发式。
# router_timeout_ms = 2500

# 交给 Flash 路由参考的最近对话轮数。
# router_context_turns = 6

[context]
# 触发压缩的 token 阈值（默认按模型上下文窗口计算，一般无需设置）。
# compaction_threshold = 800000

[approval]
# 预先放行的工具名前缀：命中的受审批工具直接执行（事件流中仍留
# approval_resolved 审计记录）。策略硬拒绝不受影响。
# 安全说明：本节只在环境变量(DEEP_CODE_APPROVAL_AUTO_ALLOW，逗号分隔)
# 或全局配置中生效；项目 .deep-code/config.toml 中的本节会被忽略并警告，
# 防止恶意仓库静默解除审批门。
# auto_allow = ["read_", "grep_"]

[stream]
# 首内容到达前的透明重试次数。
# max_retries = 3

# 连续无数据的卡顿超时（秒）。
# chunk_timeout_secs = 300

# 单次流式响应总时长上限（秒）。
# total_timeout_secs = 900

# 累计内容体积上限（字节）。
# max_bytes = 52428800
