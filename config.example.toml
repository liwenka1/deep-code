# deep-code configuration example
#
# English, like the CLI surface and the primary README. This file is what the
# unknown-key warning tells you to compare your own config against, so it is the
# one copy and it is kept in step with the schema by tests
# (`every_documented_section_reports_its_unknown_keys` and
# `the_documented_example_config_produces_no_warnings`).
#
# Load order, later layers overriding earlier ones:
#   builtin defaults -> global ~/.deep-code/config.toml
#   -> project .deep-code/config.toml -> environment -> CLI flags
#
# The project layer may only set tuning fields: provider.model,
# provider.reasoning_effort, cost.currency and ui.language.
#
# Every other behaviour knob (provider.timeout_secs, stream.*, checkpoints.*,
# context.*, cost.auto_cost_saving, approval.auto_allow) is ignored there, with
# a warning — so a hostile repository cannot starve your streams, blow up
# snapshot retention, or quietly lift the approval gate. Set those globally or
# in the environment.
#
# Three settings are tighten-only from the project layer: a repo may be
# stricter than your global config, never looser, and an attempt to loosen is
# ignored with a warning.
#   - approval.default_mode may only step DOWN (auto to default, say), never up.
#     Not even one step up: accept_edits already waves through every workspace
#     write.
#   - sandbox.network may only be stricter than the global value (always, then
#     prompt, then never). Widening is ignored — with a global "never", a
#     project-layer "prompt" is ignored too.
#   - lsp.enabled may only be set false (turning the language server off). It
#     cannot turn it on for you.
#
# provider.api_key in the project layer is always ignored (so a key cannot leak
# with the repo, nor be injected by one), and a project-layer provider.base_url
# override is refused outright.
#
# Typos are not silent. A key this file does not have (say "netwrok") and a
# value that cannot be recognized (say "nevr" for the network mode) are each
# named at startup and in `deepcode doctor`, together with the note that the
# setting kept whatever the layer below it had — rather than letting you
# believe it took effect. `deepcode doctor` also prints the sandbox network
# mode currently in force, which is how you confirm that "never" really landed.

[provider]
# DeepSeek API key. Prefer the DEEPSEEK_API_KEY environment variable or this
# global file; if you do write it here, `chmod 600` the file.
# api_key = "sk-..."

# API endpoint. Defaults to https://api.deepseek.com/beta (the beta endpoint is
# the one that streams reasoning).
# base_url = "https://api.deepseek.com/beta"

# Model: deepseek-v4-pro, deepseek-v4-flash, or auto (routed per task).
# model = "auto"

# Reasoning effort: off, low, medium, high, max.
# reasoning_effort = "high"

# Request timeout in seconds: connect plus waiting for response headers. It does
# not bound the streamed response itself — the [stream] timeouts below own that.
# timeout_secs = 60

[checkpoints]
# Snapshot retention. One workspace snapshot is taken before each turn; beyond
# this count the oldest are deleted. Zero keeps every snapshot.
# max_snapshots = 20

[sandbox]
# Network authorization for shell/job commands. Commands always run inside the
# OS sandbox and have no network by default (port binding included). When the
# model judges that a command needs the network it declares network=true in the
# arguments, and that declaration forces a human approval — the panel says the
# command is requesting network access, and "remember for this session" is keyed
# on the command identity, so a second `git push` of the same shape stops
# asking.
#
# Trust and egress are two separate grants. Reads inside the sandbox stay broad,
# so if auto-approval also opened the network, any auto-approved command could
# send out whatever it had read. That is why the default is to ask.
#
# Sub-agent dispatches (the agent tool) declaring network=true are bound by this
# setting too: "never" refuses them outright, "always" makes the egress prompt
# unnecessary. An authorized child gets ambient egress for its allow-listed
# commands — its own approvals have nobody in the loop, so a per-call
# declaration there would protect nothing. The network-native tools (fetch_url,
# web_search) ARE egress by definition: "never" refuses them as well, while
# "prompt" and "always" route them through the ordinary human approval.
#
#   prompt  a declaration goes to a human (the default)
#   always  every sandboxed command gets the network, no prompt (the old
#           coupled behaviour; only the global layer may set it)
#   never   declaring commands, networked dispatches and the web tools are all
#           refused outright
# network = "prompt"

[cost]
# Display currency for costs: cny or usd.
# currency = "cny"

# Prefer cheaper routing (lean towards Flash) in auto mode.
# auto_cost_saving = false

[lsp]
# Master switch for post-edit LSP diagnostics. When on, writing a file or
# applying a patch starts the matching language server, collects one round of
# diagnostics, and returns the errors to the model alongside the tool result.
# When off, no language server is ever started — useful when the server is not
# installed, or when you would rather it did not run. The poll interval and the
# per-round cap are constants, not settings.
# enabled = true

[context]
# Token threshold that triggers compaction. Derived from the model's context
# window by default, so this rarely needs setting.
# compaction_threshold = 800000

[approval]
# Tool names pre-cleared from approval, matched in full (not as a prefix): a
# gated tool named here runs straight away, and the event stream still carries
# an approval_resolved record for the audit trail. Policy hard-denials are
# unaffected.
#
# Why full names rather than prefixes: standing consent must not stretch. A rule
# of "w" would cover write_file and web_search at once, and a tool added later
# whose name extends an existing entry would ship pre-approved without anyone
# deciding that.
#
# Security: this section only takes effect from the environment
# (DEEP_CODE_APPROVAL_AUTO_ALLOW, comma-separated) or the global config. In a
# project .deep-code/config.toml it is ignored with a warning, so a hostile repo
# cannot quietly lift the approval gate.
#
# Note that clearing a tool is standing consent to the WHOLE tool, which
# includes skipping the per-call network approval described under [sandbox]:
# clear "shell" and a command declaring network=true runs with egress, unasked.
# If what you want is undisturbed networking, set the sandbox network mode to
# "always" instead of clearing all of shell.
#
# One exception: request_write_root (the model asking for a writable root) is
# never covered here. Naming it in full still raises the prompt — widening the
# write boundary is a decision only a human makes, and there is no standing
# consent for it.
#
# Only meaningful for tools that would otherwise be gated. read_file, list_dir
# and grep_files are read-only and never reach the approval gate, so listing
# them is a no-op (and warns about nothing, because those tools do exist). The
# example below uses tools that really are gated.
# auto_allow = ["write_file", "apply_patch"]

# Permission tier at startup:
#   default       ask every time
#   accept_edits  auto-approve edits inside the workspace
#   auto          the classifier decides what is left
#   yolo          everything except a write-root request
#
# A project config may only be stricter than the global one (global auto with
# project default, say); stepping up is always ignored, and auto/yolo may come
# only from the global config, so a hostile repo cannot lift the gate.
#
# "yolo" is not literally everything: request_write_root prompts at every tier.
# Under yolo, sandboxed commands get ambient egress — with nobody in the loop, a
# declaration-based prompt stops no attacker and only strands honest undeclared
# commands offline. A sandbox network mode of "never" stays absolute even there.
#
# Shift+Tab cycles the tier at runtime.
#
# A deliberate limit of the auto tier: the classifier reads the command and its
# argument text only, never the content about to be written — so what
# write_file/apply_patch actually put on disk is not reviewed by it. (The top
# risk tier, a network declaration and an offline backend still force a human.)
# If that boundary matters to you, stay on default or accept_edits.
#
# One more rule, and it is not configurable: a command whose text carries any of
# > < ` $ { } ( ) * ? [ ] — redirection, command substitution, variable, brace
# or glob expansion, a subshell — always goes to a human and enters no
# auto-approval path at all. So `echo $HOME`, `mkdir -p src/$MOD`,
# `cp a "$HOME/b"` and `rm *.log` ask once even under accept_edits or auto:
# an indirect form cannot be read statically for what it will finally do, and
# handing it to a person is the deliberate conservative choice. An operand that
# points outside the working directory by its spelling (`/...`, `~/...`,
# `../...`) is excluded the same way: `git diff /dev/null ~/.ssh/id_rsa` asks,
# `git diff main..HEAD` does not.
#
# A command that runs without a prompt (a trust-list hit, an identity remembered
# for the session, an accept_edits file operation) never reaches a shell: the
# words the policy parsed are execve'd directly, and `&&`, `;` and newlines are
# sequenced by deep-code itself, while pipes and a background `&` ask. Only a
# command a human approved as text goes through `sh -c`.
# default_mode = "default"

[stream]
# Transparent retries before the first content arrives.
# max_retries = 3

# Stall timeout in seconds with no data at all.
# chunk_timeout_secs = 300

# Total wall-clock ceiling for one streamed response, in seconds.
# total_timeout_secs = 900

# Cumulative response body ceiling, in bytes.
# max_bytes = 52428800

[ui]
# Interface language: auto (follows the system LANG/LC_ALL), zh, or en.
# DEEP_CODE_LANG outranks this; /lang switches and persists it from the TUI.
# language = "auto"
