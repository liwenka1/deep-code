# Release Prep —— 一键发版入口
#
# 触发：Actions 页面 workflow_dispatch，输入要发布的新版本号（不带 v）。
# 执行：归档 Unreleased 并补充起草条目 → bump 三个版本文件 → chore(release)
#       commit → 打 v 标签 → 推送。推送用 GitHub App 身份 —— 这是硬要求，
#       不是装饰：GITHUB_TOKEN 推的 tag 不会触发其他 workflow，release.yml
#       会静默不跑，发版等于没发生。缺 App secrets 时这里直接失败。
#
# 全链路 fail-closed：起草失败/输出不成 bullets/版本不一致/标签已存在/
# main 在运行期间被推进（push 非快进被拒，tag 一并不推），任何一处失败都
# 停在 tag 之前，不存在"版本推了、changelog 是坏的"的中间态。
#
# 已审阅的 Unreleased 条目原样进入版本节，模型负责补充其他条目。
# GitHub Release 的正文取自 tag 中同一个版本节。
#
# CHANGELOG 从 main 历史上版本号最高、已发布到 npm 的正式 tag 起草。
# 起草器使用独立的已发布固定版本。

name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, no leading v)'
        required: true

# 同一时刻只允许一次发版准备在跑，杜绝并发双开互相踩 tag。
concurrency:
  group: release-prep
  cancel-in-progress: false

permissions:
  contents: read # 写操作全部走 App token，GITHUB_TOKEN 保持最小权限

defaults:
  run:
    shell: bash

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      HAS_APP: ${{ secrets.DEEPCODE_APP_ID != '' && secrets.DEEPCODE_APP_PRIVATE_KEY != '' }}
      HAS_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - name: Preflight (branch, secrets, version shape)
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::releases cut from main only (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "$HAS_APP" != "true" ]; then
            echo "::error::DEEPCODE_APP_ID / DEEPCODE_APP_PRIVATE_KEY secrets are required: a GITHUB_TOKEN-pushed tag does not trigger release.yml, so the release would silently not happen."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is required to draft the changelog."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a leading v (got: $VERSION)"
            exit 1
          fi

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.DEEPCODE_APP_ID }}
          private-key: ${{ secrets.DEEPCODE_APP_PRIVATE_KEY }}

      # Resolved at runtime, never hardcoded: renaming the App must not
      # require touching any workflow. (Same pattern as deepcode-bot.yml.)
      - name: Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and tags for the draft range and App token for the push.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=24.18.0 <25'

      - name: Verify new tag and find the published changelog baseline
        id: range
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi
          PUBLISHED=$(npm view @liwenkai/deepcode versions --json --registry https://registry.npmjs.org)
          PREV_TAG=$(
            git for-each-ref --merged=HEAD --sort=-version:refname --format='%(refname:strip=2)' refs/tags \
              | jq -Rrs --argjson published "$PUBLISHED" '
                  split("\n")
                  | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  | map(select(.[1:] as $version | $published | arrays | index($version)))
                  | .[0] // empty
                '
          )
          if [ -z "$PREV_TAG" ]; then
            echo "::error::no stable tag on main matches a published @liwenkai/deepcode version"
            exit 1
          fi
          COUNT=$(git rev-list --count "${PREV_TAG}..HEAD")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no commits since ${PREV_TAG} — nothing to release"
            exit 1
          fi
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "drafting from ${COUNT} commits since ${PREV_TAG}"

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          toolchain: 1.96.0

      - name: Install deepcode
        # Change this pin after verifying the new drafter is published on npm.
        run: npm install -g --allow-scripts=@liwenkai/deepcode @liwenkai/deepcode@0.5.1

      # Keep supplemental notes in bullet form so the merge can validate them.
      - name: Draft additional changelog entries
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEP_CODE_DISABLE_WEB: '1'
          PREV_TAG: ${{ steps.range.outputs.prev_tag }}
        run: |
          git log --no-merges --format='%s' "${PREV_TAG}..HEAD" \
            | grep -v '^chore(release)' \
            | deepcode -p "Draft additional CHANGELOG entries for deep-code v${VERSION}. stdin has the commit subjects since ${PREV_TAG}, written in Chinese. Read CHANGELOG.md for style. Reviewed notes in Unreleased and in pending version sections above ${PREV_TAG} will be carried forward. Cover other user-facing changes in English. Merge related commits and omit internal refactors, tests, docs and CI plumbing unless they affect users. Prefix security-behavior bullets with '**Security:**'. Stay close to the commit wording. Output only bullets starting with '- ' (continuation lines indented two spaces). Leave the draft empty if there are no additional entries." \
              --timeout 600 > "$RUNNER_TEMP/changelog-draft.md"
          echo "=== draft ==="
          cat "$RUNNER_TEMP/changelog-draft.md"

      - name: Merge reviewed notes and draft into the release section
        env:
          PREV_TAG: ${{ steps.range.outputs.prev_tag }}
        run: |
          node scripts/release-notes.mjs prepare "$VERSION" "$PREV_TAG" "$RUNNER_TEMP/changelog-draft.md" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Bump versions
        run: |
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"$/version = \"${VERSION}\"/" Cargo.toml
          grep -q "^version = \"${VERSION}\"$" Cargo.toml || {
            echo "::error::failed to bump Cargo.toml"; exit 1; }
          (cd packages/deepcode && npm version "${VERSION}" --no-git-tag-version >/dev/null)
          # Sync the lockfile's workspace-member versions (path deps only).
          cargo update --workspace

      # Same checks release.yml runs at tag time; failing here is cheaper.
      - name: Verify consistency
        run: |
          NPM=$(grep -m1 '"version"' packages/deepcode/package.json \
            | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          CARGO=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION  npm=$NPM  cargo=$CARGO"
          [ "$VERSION" = "$NPM" ] || { echo "::error::package.json is $NPM"; exit 1; }
          [ "$VERSION" = "$CARGO" ] || { echo "::error::Cargo.toml is $CARGO"; exit 1; }
          node scripts/release-notes.mjs render "$VERSION" >/dev/null

      # main and the tag go in ONE ATOMIC push: without --atomic git updates
      # each ref independently, so a main that advanced mid-run was rejected
      # while the TAG still landed. That orphan tag triggers release.yml, whose
      # version gate reads the tag's own tree and therefore passes — npm would
      # publish a version whose chore(release) commit never reached main, with
      # no changelog section on main and a tag outside the next draft range.
      # --atomic makes the whole push fail together.
      - name: Commit, tag, push
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add CHANGELOG.md Cargo.toml Cargo.lock packages/deepcode/package.json
          git commit -m "chore(release): ${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin "HEAD:main" "refs/tags/v${VERSION}"

      - name: Summary
        run: |
          {
            echo "## Release queued for v${VERSION}"
            echo
            echo "The Release workflow builds, verifies installation, and publishes to npm."
            echo
            echo "CHANGELOG section included in the tag"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
