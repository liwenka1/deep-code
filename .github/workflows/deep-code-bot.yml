name: Deep Code Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  deepcode:
    # 只有仓库 Owner 自己才能触发
    if: |
      contains(github.event.comment.body, '/deepcode') &&
      github.event.comment.user.login == github.event.repository.owner.login
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deep-code
        run: npm i -g @liwenkai/deepcode

      # 拉取 Issue 全部评论，拼接成对话上下文
      - name: Build conversation context
        id: prompt
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            // 拉取 Issue body 和所有评论
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // 拼对话历史
            let history = '## 对话历史\n\n';
            history += '### Issue 标题\n' + issue.data.title + '\n\n';

            if (issue.data.body) {
              history += '### 第一条（Issue 正文）\n' + issue.data.body + '\n\n';
            }

            for (const comment of comments.data) {
              if (comment.user.type === 'Bot') continue;
              history += '### ' + comment.user.login + '\n' + comment.body + '\n\n';
            }

            const currentPrompt = context.payload.comment.body
              .replace(/^\/deepcode\s*/, '')
              .trim() || '请分析一下这个项目';

            // result 用 return（给 deep-code），user_prompt 用 setOutput（给 PR 标题）
            core.setOutput('user_prompt', currentPrompt);
            return '以下是本 Issue 的对话历史，根据上下文回答问题。\n\n' + history + '\n---\n当前指令：' + currentPrompt;

      # 启动 deep-code HTTP 服务（不需要 TTY）
      - name: Start deep-code server
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 预放行所有工具，绕过交互式审批
          DEEP_CODE_APPROVAL_AUTO_ALLOW: "read_,list_,grep_,write_,apply_,shell,job,fetch_,web_"
        run: |
          deepcode serve --http --port 7878 --auth-token bot-token &
          echo "等待服务就绪..."
          for i in $(seq 1 15); do
            if curl -s http://127.0.0.1:7878/health > /dev/null 2>&1; then
              echo "服务已就绪"
              break
            fi
            sleep 1
          done

      # 发送指令给 deep-code，等待完成，保存返回的 SSE 事件
      - name: Run deep-code
        run: |
          # 用 jq 安全构造 JSON，避免换行符破坏请求
          echo '${{ steps.prompt.outputs.result }}' > /tmp/deepcode-prompt.txt
          jq -n --rawfile prompt /tmp/deepcode-prompt.txt '{prompt: $prompt}' > /tmp/deepcode-request.json

          # 调用 /v1/prompt API，返回 SSE 流
          curl -s -N -X POST http://127.0.0.1:7878/v1/prompt \
            -H "Authorization: Bearer bot-token" \
            -H "Content-Type: application/json" \
            -d @/tmp/deepcode-request.json \
            > /tmp/deepcode-events.txt 2>&1

          # 从 SSE 中提取 AI 的文本回答，拼接成连续文本
          # 只取 provider（正式回答），不要 reasoning.delta（思考过程）
          grep '^data: ' /tmp/deepcode-events.txt | while read -r line; do
            json=$(echo "$line" | sed 's/^data: //')
            kind=$(echo "$json" | jq -r '.item.kind // empty' 2>/dev/null)
            if [ "$kind" = "provider" ]; then
              text=$(echo "$json" | jq -r '.item.payload.provider.text // empty' 2>/dev/null)
              if [ -n "$text" ] && [ "$text" != "null" ]; then
                printf '%s' "$text"
              fi
            fi
          done > /tmp/deepcode-answer.txt
          echo "" >> /tmp/deepcode-answer.txt

          # 如果还是空的，dump 原始 JSON 方便排查
          if [ ! -s /tmp/deepcode-answer.txt ]; then
            echo "（debug：以下为原始 SSE 事件 JSON）" > /tmp/deepcode-answer.txt
            grep '^data: ' /tmp/deepcode-events.txt | head -5 >> /tmp/deepcode-answer.txt
          fi

      # 检查是否有文件被修改
      - name: Check diff
        id: diff
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short >> /tmp/deepcode-summary.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # 有文件改动则提交 PR
      - name: Create PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deepcode-bot-$(date +%s)"
          git config user.name "deep-code-bot"
          git config user.email "bot@deep-code.dev"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "🤖 deep-code: ${{ steps.prompt.outputs.user_prompt }}"
          git push origin "$BRANCH"
          # 先创建标签（不存在则忽略报错）
          gh label create "🤖 deep-code" --color "1a9945" 2>/dev/null || true
          gh pr create \
            --title "🤖 deep-code: ${{ steps.prompt.outputs.user_prompt }}" \
            --body "由 @${{ github.event.comment.user.login }} 在 Issue #${{ github.event.issue.number }} 中触发" \
            --head "$BRANCH" \
            --label "🤖 deep-code"

      # 把 deep-code 的回答贴回 Issue 评论区
      - name: Post reply
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/deepcode-answer.txt', 'utf8').slice(0, 60000);
            // 模型流式输出可能缺失段落间隔，在 ## / ### 标题前补双换行
            let answer = raw.replace(/([^\n])(#{1,3}\s)/g, '$1\n\n$2').trim();
            const hasChanges = '${{ steps.diff.outputs.has_changes }}' === 'true';

            let body = '## 🤖 Deep Code\n\n';
            body += answer + '\n\n';

            if (hasChanges) {
              body += '✅ **已提交 PR，请查看仓库中的新 PR。**';
            } else {
              body += '✅ 分析完毕，当前代码无需修改。';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
