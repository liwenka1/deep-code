# RUSTSEC advisory gate for deep-code
#
# 触发：依赖真正可能变化的时刻（Cargo.lock/Cargo.toml/本文件被推到 main、
#       或出现在 PR 里）+ 每周一次定时（新披露的通告不伴随任何 push,
#       定时是它们唯一的入场通道）+ 手动。
#
# 可维护性与 yanked 告警照常打印，但 unsound 必须挡门。unsound 会把运行时
# 安全性置于未验证状态，不能当成普通噪音；yanked 依赖目前仍由 arboard 的
# Windows 传递依赖带入，先保留为可见告警。ratatui 0.29 间接固定的 lru
# 两条 advisory 经过调用路径审查后暂时显式豁免，待 ratatui 升级兼容后移除。
name: Audit

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock against RUSTSEC
        run: cargo audit

      # The default command only reports unsound advisories as warnings and
      # exits 0. Make that release-relevant class an explicit gate. The two
      # lru advisories are the known ratatui 0.29 transitive exception; keep
      # their IDs visible here so the exemption is auditable and removable.
      - name: Block unsound dependencies
        run: >-
          cargo audit --deny unsound
          --ignore RUSTSEC-2026-0002
          --ignore RUSTSEC-2026-0253
