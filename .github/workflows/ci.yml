# CI gate for deep-code
#
# 触发：push 到 main、以及所有 pull request
# 检查：rustfmt 格式、clippy(-D warnings)、全 workspace 测试

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A push to main inherits the repository default
# otherwise, which can be read/write — this workflow only ever needs to check
# out and build, and release-prep.yml already declares the same floor.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # This runner has Landlock+seccomp; make their absence a failure, not a
        # silent skip, so a base-image change that drops the backend is caught
        # here rather than shipping unconfined (see `require_backend_or_skip`).
        env:
          DEEPCODE_REQUIRE_SANDBOX: "1"
        run: cargo test --locked --workspace

  # Compiles & tests the macOS-only Seatbelt code. These tests actually spawn
  # `sandbox-exec`, so this job is the only place the real profile is enforced
  # end to end — the other two jobs `cfg`-skip all of it. macOS is also the
  # primary development and release platform.
  macos:
    name: macos · clippy · test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # Seatbelt is present on every macOS runner; require it so a nested or
        # restricted environment that forbids sandbox-exec fails loudly.
        env:
          DEEPCODE_REQUIRE_SANDBOX: "1"
        run: cargo test --locked --workspace

  # Runs on the exact runner label the release workflow builds linux-arm64 on.
  # Release is tag-triggered only, so without this job that label would first
  # be exercised *after* the tag is pushed — and an invalid label does not
  # fail, it queues forever. This also covers aarch64 (Landlock/seccomp) with
  # real tests, which no other job does. Free for public repos.
  linux-arm:
    name: linux-arm · clippy · test
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # aarch64 Landlock+seccomp, same requirement as the x86_64 job.
        env:
          DEEPCODE_REQUIRE_SANDBOX: "1"
        run: cargo test --locked --workspace

  # `rust-version` in Cargo.toml was a claim nothing checked: every workflow and
  # rust-toolchain.toml pin 1.96, so nothing anywhere compiled against the
  # declared floor. A `cargo check` on that exact toolchain is the cheapest way
  # to keep the manifest honest — verified to pass before this job was added, so
  # a red here means the floor really did move and the manifest must follow.
  msrv:
    name: msrv · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared minimum toolchain
        # Keep in step with `rust-version` in Cargo.toml, not with
        # rust-toolchain.toml — this job exists to test the other number.
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      # RUSTUP_TOOLCHAIN, not the toolchain the action made default. The action
      # runs `rustup default 1.88.0`, and `rustup default` is the LOWEST-
      # priority override rustup has — `rust-toolchain.toml` (pinning 1.96.0)
      # outranks it. So a plain `cargo check` in this working tree silently
      # downloaded and used 1.96, and the job could never go red for an MSRV
      # reason: a permanent green with a check mark next to the one claim it
      # exists to test. RUSTUP_TOOLCHAIN is priority 2, above the file.
      #
      # Verifying this by hand does not translate, which is why it slipped:
      # `cargo +1.88 check` locally uses `+toolchain`, priority 1, which also
      # beats the file. The floor really does pass — it was the CI spelling
      # that was wrong, not the number. `rustc --version` is printed so the log
      # proves which toolchain ran instead of a comment asserting it.
      - name: Check against the declared floor
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          rustc --version
          cargo check --locked --workspace

  # The x86_64 half of the same argument as `linux-arm` above. release.yml
  # builds and tests linux-x64 on `ubuntu-22.04` (pinned there for the glibc
  # floor), and no CI job used that image: `check` runs ubuntu-latest (24.04).
  # So the one runner image the release gate depends on was first exercised
  # *after* the tag is pushed — and since 4e513e7 that leg also demands
  # DEEPCODE_REQUIRE_SANDBOX, so an image whose kernel lacked Landlock would
  # turn the discovery into a red release with a tag already in place.
  linux-x64-release-image:
    name: linux-x64 (22.04) · test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Test
        # Both variables release.yml sets on this leg, so "the same demand" is
        # the same demand. (SYMLINKS is inert on unix — the helper panics
        # rather than skipping there — but a leg that claims to mirror another
        # and then sets a different environment is how the two drift apart.)
        #
        # What this job still does NOT cover, stated plainly: release.yml also
        # runs `cargo build --locked --release --target ...`, and nothing in CI
        # ever builds the release profile on any platform. `opt-level="z"` +
        # `lto=true` + `codegen-units=1` + `panic="abort"` is a different
        # compilation; an LTO failure is still first discovered after the tag.
        # This job closes the "does the image exist and does its kernel have
        # Landlock" half only.
        env:
          DEEPCODE_REQUIRE_SANDBOX: "1"
          DEEPCODE_REQUIRE_SYMLINKS: "1"
        run: cargo test --locked --workspace

  # Compiles & tests the Windows-only sandbox (Job Object) code, which the
  # Linux job's `cfg(windows)` gating skips.
  windows:
    name: windows · clippy · test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump both together.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # The hosted runner is elevated and CAN create symlinks, so the
        # symlink-boundary tests' "no privilege → skip" branch must never be
        # taken here: libtest captures the skip message, making a skipped
        # security test indistinguishable from a passing one. Same insurance
        # as DEEPCODE_REQUIRE_SANDBOX on the unix jobs.
        #
        # DEEPCODE_REQUIRE_SANDBOX is inert on Windows (its only reader is
        # `cfg(any(linux, macos))`), and it is set here for the same reason
        # release.yml sets it on its win32 leg: harmless today, correct the day
        # a Windows backend exists, and one fewer difference between the two.
        env:
          DEEPCODE_REQUIRE_SYMLINKS: "1"
          DEEPCODE_REQUIRE_SANDBOX: "1"
        run: cargo test --locked --workspace
